name: Release - X Lite APK

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Generate release version
        id: release_version
        env:
          FORCE_PATCH: "true"
        run: |
          set -euo pipefail
          chmod +x .github/scripts/generate-changelog.sh
          .github/scripts/generate-changelog.sh \
            2>/tmp/release-version-output \
            >/tmp/release-changelog-output

          cat /tmp/release-version-output
          NEW_VERSION=$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' /tmp/release-version-output | tail -n1)
          SEMANTIC_BUMP=$(grep '^semantic_bump=' /tmp/release-version-output | tail -n1 | cut -d= -f2)

          test -n "$NEW_VERSION"
          test -n "$SEMANTIC_BUMP"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "semantic_bump=$SEMANTIC_BUMP" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GRADLE_OPTS: -Dorg.gradle.caching=true
        run: |
          mkdir -p bins
          uv run main.py \
            --release-tag "${{ steps.release_version.outputs.new_version }}" \
            --semantic-bump "${{ steps.release_version.outputs.semantic_bump }}" \
            --changelog-file /tmp/release-changelog-output

      - name: Commit release metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release_version.outputs.new_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json
          if git diff --cached --quiet; then
            echo "no release metadata changes"
            exit 0
          fi
          git commit -m "chore: update release metadata for ${TAG} [skip ci]"
          git push